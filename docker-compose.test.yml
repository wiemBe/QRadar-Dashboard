# Ephemeral PostgreSQL + TimescaleDB for the integration test suite.
#
#   docker compose -f docker-compose.test.yml up -d test-db
#   export TEST_DATABASE_URL=postgresql+asyncpg://test:test@localhost:5433/qradar_obs_test
#   (cd backend && pytest -m integration)
#   docker compose -f docker-compose.test.yml down -v
#
# Port 5433 avoids colliding with a dev Postgres on 5432.

name: qradar-observability-test

services:
  test-db:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: qradar_obs_test
    ports:
      - "5433:5432"
    tmpfs:
      # Test data is disposable; keep it in RAM for speed and clean teardown.
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d qradar_obs_test"]
      interval: 3s
      timeout: 3s
      retries: 20
