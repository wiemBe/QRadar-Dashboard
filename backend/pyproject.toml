[project]
name = "qradar-observability-backend"
version = "0.1.0"
description = "On-premises QRadar observability and SOC analytics platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "asyncpg>=0.30",
    "celery>=5.4",
    "redis>=5.2",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "cryptography>=43.0",
    "python-json-logger>=2.0",
    "slowapi>=0.1.9",
    "authlib>=1.3",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "bleach>=6.2",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "C4", "SIM", "RUF"]
# S101: pytest uses bare assert.
# N811: PgUUID is a deliberate, conventional alias for postgresql.UUID.
# N818: domain exceptions (PermissionDenied, ArielTimeout, ...) read better
#       without an -Error suffix and are used consistently.
# B027: QRadarProvider.aclose is an intentional optional no-op hook, not abstract.
ignore = ["S101", "N811", "N818", "B027"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom relies on calls in argument defaults.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path", "fastapi.Body",
]

[tool.ruff.lint.per-file-ignores]
# S105/S106: test fixtures use dummy tokens. S311: jitter/determinism, not crypto.
# C408: dict(...) kwargs-style is intentional in test factories.
"tests/*" = ["S105", "S106", "S311", "C408"]
"alembic/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires postgres/redis",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
